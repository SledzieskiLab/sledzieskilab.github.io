# ============================================================
#  Software — tools and packages from the lab.
#
#  `repo`  owner/name on GitHub; the template builds the URL and,
#          with `stars: true`, shows a live star badge.
#  `home`  use instead of `repo` for tools whose homepage isn't a
#          GitHub repository.
#  `area`  groups the list on /software/.
#  `logo`  optional image in assets/images/software/, shown in a left
#          column like the publication thumbnails. Use a SQUARE image
#          on a transparent or light background.
#  `emoji` optional stand-in when there's no bespoke logo
#  `links` any of: pypi, docs, paper, database
#  `blurb` free text description of the software.
# ============================================================

- name: "D-SCRIPT"
  area: "Protein Networks"
  emoji: "📜"
  repo: "samsledje/D-SCRIPT"
  stars: true
  blurb: "Sequence-based prediction of protein-protein interactions using a protein language model. Also ships the Topsy-Turvy and TT3D models."
  links:
    pypi: "https://pypi.org/project/dscript/"
    paper: "https://www.cell.com/cell-systems/pdfExtended/S2405-4712(21)00333-1"

