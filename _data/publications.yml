# ============================================================
#  Publications — maintained by hand.
#
#  TO ADD A PAPER: copy a block, newest at the top.
#
#  Fields:
#    title     (required)
#    authors   (required) — use **Name** to bold lab members
#    venue     (required) — journal or conference
#    year      (required) — integer, used for grouping
#    area      optional   — groups the paper under "Group by: Area"
#    status    optional   — 'preprint' | 'in press' | 'workshop'
#                           (omit for a normal published paper).
#                           Renders as the badge beside the title.
#    type      optional   — "inproceedings" for conference papers;
#                           defaults to a BibTeX @article entry
#    doi       optional   — bare DOI (no https://doi.org/ prefix).
#                           Used for the BibTeX entry; the visible link
#                           lives in links.paper.
#    volume / number / pages   optional — included in the BibTeX entry
#    image     optional   — thumbnail in assets/images/pubs/
#    selected  optional   — true puts it on the homepage and in the
#                           "Selected" filter on /publications/
#    note      optional   — short callout shown after the venue
#    citekey   (set on every entry) — the BibTeX key.
#    bibtex_authors  optional — override author parsing
#
#  Links: each entry shows one link to the paper, a BibTeX button, and
#  a code link when there is one. DOI and publisher PDF both resolve to
#  the same paper, so only one is shown — prefer the DOI, it's stable.
#    links:
#      paper: 'https://doi.org/...'   # or a PDF/preprint URL
#      code:  'https://github.com/...'
# ============================================================

