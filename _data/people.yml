# ============================================================
#  Lab members
#
#  To add someone: drop a square photo (600x600+, JPG/PNG) in
#  assets/images/people/ as firstname-lastname.jpg, copy an entry
#  below, and edit the fields (only `name` and `role` are required;
#  `photo` falls back to a placeholder if missing).
#
#  `group` sets the order on /team/ — pi, postdoc, phd, masters,
#  undergrad, staff (from `people_groups` in _data/settings.yml).
# ============================================================

- name: "Samuel Sledzieski"
  role: "Principal Investigator"
  group: pi
  photo: "sam-sledzieski-2026.jpg"
  bio: >-
    Sam is an Incoming Assistant Professor in the [Halıcıoğlu Data Science Institute](https://datascience.ucsd.edu/) at [UC San Diego](https://ucsd.edu/). Prior to joining HDSI, he was a postdoc at the Flatiron Institute [Center for Computational Biology](https://www.simonsfoundation.org/flatiron/computational-biology/) and Princeton University's [Lewis Sigler Institute](https://lsi.princeton.edu/). Sam has held research positions at [Microsoft Research](https://www.microsoft.com/en-us/research/group/ai-for-good-research-lab/) and the [Centre Scientifique de Monaco](https://www.centrescientifique.mc/en). He received his PhD and SM in Computer Science from MIT, and his BS in Computer Science from the University of Connecticut. He is a recipient of the National Science Foundation Graduate Research Fellowship.


  links:
    email: "ssledzieski@ucsd.edu"
    website: "https://samsl.io"
    github: "samsledje"
    scholar: "https://scholar.google.com/citations?user=BoZ7AqYAAAAJ&hl=en"
    bluesky: "samsl.io"

